<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ブロックパズル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="icon" href="blockpuzzle_icon.png" type="image/png">
<link rel="apple-touch-icon" href="blockpuzzle_icon.png" type="image/png">
<link rel="manifest" href="manifest.json">  
<style>
/* Layout: one full-screen canvas (header / 8x8 board / 3-piece tray), DOM overlays for settings and game over. Single dark-blue look by design. */
:root {
  --bg: #3a4b8c;
  --bg2: #33437f;
  --board: #1b2150;
  --gold: #ffb52e;
  --ink: #ffffff;
  --panel: #27326b;
  --accent: #ff4f7b;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); }
body { color: var(--ink); font-family: Fredoka, "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#wrap { position: relative; width: 100%; height: 100%; }
canvas { display: block; touch-action: none; }
[hidden] { display: none !important; }
.ov { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(14, 19, 52, .8); }
.card { width: 100%; max-width: 320px; background: var(--panel); color: var(--ink); border-radius: 22px; padding: 24px 20px 20px; box-sizing: border-box; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.lbl { font-size: 14px; letter-spacing: .2em; opacity: .7; }
.sharetext { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 10px; border-radius: 10px; border: 0; font: inherit; font-size: 14px; }
.big { font-size: 64px; font-weight: 700; line-height: 1.1; margin: 4px 0 22px; font-variant-numeric: tabular-nums; }
button { font: inherit; font-weight: 600; font-size: 18px; border: 0; border-radius: 14px; padding: 13px 18px; width: 100%; color: #fff; background: var(--accent); box-shadow: 0 4px 0 #b52a52; cursor: pointer; }
button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b52a52; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 4px 0 8px; }
button.th { width: auto; padding: 0; height: 52px; border-radius: 12px; box-shadow: none; border: 3px solid transparent; font-size: 11px; font-weight: 600; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
button.th:active { transform: none; box-shadow: none; }
button.th[aria-pressed="true"] { border-color: #fff; outline: 2px solid var(--accent); }
.rowlabel { font-size: 18px; padding: 12px 4px 6px; text-align: left; }
button.alt { background: #4a5cab; box-shadow: 0 4px 0 #34428a; margin-top: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; font-size: 18px; padding: 12px 4px; text-align: left; }
.sw { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 15px; background: #4a5278; position: relative; transition: background .15s; margin: 0; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw:checked { background: #3ec97a; }
.sw:checked::after { transform: translateX(22px); }
.sw:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }
</style>

<div id="wrap">
  <canvas id="c" aria-label="ブロックパズルの盤面"></canvas>

  <div class="ov" id="settings" hidden>
    <div class="card" role="dialog" aria-label="設定">
      <h2>設定</h2>
      <label class="row" for="optSound">サウンド<input type="checkbox" class="sw" id="optSound" checked></label>
      <label class="row" for="optVib">バイブレーション<input type="checkbox" class="sw" id="optVib" checked></label>
      <div class="rowlabel">テーマ</div>
      <div class="themes" id="themes" role="group" aria-label="テーマ"></div>
      <button class="alt" id="btnRestart">最初からやり直す</button>
      <button class="alt" id="btnClose">閉じる</button>
    </div>
  </div>

  <div class="ov" id="over" hidden>
    <div class="card" role="dialog" aria-label="ゲームオーバー">
      <div class="lbl">SCORE</div>
      <div class="big" id="overScore">0</div>
      <button id="btnAgain">もう一度プレイ</button>
      <button class="alt" id="btnShare">共有</button>
      <input id="shareText" class="sharetext" type="text" readonly hidden aria-label="共有テキスト">
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const N = 8;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const wrap = document.getElementById('wrap');
  const FONT = 'Fredoka, "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif';

  // [base, light, dark]
  const PAL = [
    ['#f0922c', '#ffb866', '#b8650f'], // orange
    ['#f2b72a', '#ffd966', '#b98609'], // yellow
    ['#d8333a', '#f06b6f', '#9a1c24'], // red
    ['#35b44a', '#6fdc7f', '#1f7f31'], // green
    ['#2f55d8', '#6a8cf5', '#1c37a0'], // blue
    ['#27b4e6', '#6bd8fa', '#1480a8'], // cyan
    ['#8a4ad6', '#b685f0', '#5c28a0'], // purple
    ['#ea5fa0', '#ff95c6', '#a93069'], // pink
  ];

  // base shapes (rotations are generated), weight
  const BASES = [
    [['X'], 3],
    [['XX'], 5], [['XXX'], 7], [['XXXX'], 6], [['XXXXX'], 5],
    [['XX', 'XX'], 5],
    [['X.', 'XX'], 8],
    [['XX', '.X', '.X'], 5],
    [['X.', 'X.', 'XX'], 4],
    [['XXX', '.X.'], 3],
    [['.XX', 'XX.'], 3],
    [['XX.', '.XX'], 3],
    [['XXX', 'XXX', 'XXX'], 1],
    [['XXX', 'XXX'], 2],
  ];
  const rot = g => g[0].split('').map((_, c) => g.map(row => row[c]).reverse().join(''));
  const SHAPES = BASES.map(([g, w]) => {
    const seen = new Set(), list = [];
    let cur = g;
    for (let i = 0; i < 4; i++) {
      const k = cur.join('/');
      if (!seen.has(k)) { seen.add(k); list.push(cur); }
      cur = rot(cur);
    }
    return { list, w };
  });
  const TOTAL_W = SHAPES.reduce((a, s) => a + s.w, 0);

  function makePiece() {
    let r = Math.random() * TOTAL_W, s = SHAPES[0];
    for (const sh of SHAPES) { if ((r -= sh.w) < 0) { s = sh; break; } }
    const g = s.list[Math.floor(Math.random() * s.list.length)];
    const cells = [];
    g.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'X') cells.push([y, x]); }));
    return { cells, h: g.length, w: g[0].length, color: Math.floor(Math.random() * PAL.length), used: false, appear: 0 };
  }

  // ---------- themes ----------
  const THEMES = [
    { id: 'blue',   name: 'ブルー',   bg0: '#3d4f93', bg1: '#33437f', board: '#1b2150', edge: '#12173f', grid: 'rgba(120,140,230,.14)', ink: '#ffffff', icon: '#a9b8ff', panel: '#27326b', pcard: '#ffffff' },
    { id: 'night',  name: 'ナイト',   bg0: '#1a1a28', bg1: '#0d0d15', board: '#1f2030', edge: '#08080e', grid: 'rgba(255,255,255,.07)', ink: '#f2f2fa', icon: '#9aa0c8', panel: '#262840', pcard: '#ffffff' },
    { id: 'forest', name: '森', bg0: '#2f6b52', bg1: '#24503f', board: '#163a2d', edge: '#0d271e', grid: 'rgba(140,230,180,.15)', ink: '#ffffff', icon: '#a6ecc6', panel: '#1f4a3b', pcard: '#ffffff' },
    { id: 'sunset', name: '夕焼け', bg0: '#8a4296', bg1: '#5b2d7c', board: '#341650', edge: '#230d38', grid: 'rgba(240,160,230,.16)', ink: '#ffffff', icon: '#f1b5f0', panel: '#4a2470', pcard: '#ffffff' },
    { id: 'light',  name: 'ライト',   bg0: '#eef2fd', bg1: '#d6dff5', board: '#f8faff', edge: '#a9b7e0', grid: 'rgba(60,80,160,.16)', ink: '#27336e', icon: '#5b6bb0', panel: '#ffffff', pcard: '#27336e' },
  ];
  let theme = THEMES[0];
  function applyTheme(id, save) {
    theme = THEMES.find(t => t.id === id) || THEMES[0];
    const r = document.documentElement.style;
    r.setProperty('--bg', theme.bg1); r.setProperty('--panel', theme.panel); r.setProperty('--ink', theme.pcard);
    document.querySelectorAll('#themes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === theme.id)));
    if (save) store.set('bp_theme', theme.id);
  }

  // ---------- persistence ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };

  // ---------- state ----------
  let grid, tray, score, shown, best, startBest, combo, over, overAt;
  let sound = store.get('bp_sound', '1') === '1';
  let vib = store.get('bp_vib', '1') === '1';
  let drag = null;
  let parts = [], pops = [], clearing = [];
  let W = 0, H = 0, DPR = 1, cs = 40, bs = 320, bx = 0, by = 0, trayY = 0, mini = 20;

  function fits(p, r0, c0) {
    for (const [y, x] of p.cells) {
      const r = r0 + y, c = c0 + x;
      if (r < 0 || c < 0 || r >= N || c >= N || grid[r][c] >= 0) return false;
    }
    return true;
  }
  function fitsAnywhere(p) {
    for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (fits(p, r, c)) return true;
    return false;
  }
  function gen3() {
    let ps;
    for (let t = 0; t < 40; t++) {
      ps = [makePiece(), makePiece(), makePiece()];
      if (ps.some(fitsAnywhere)) break;
    }
    return ps;
  }
  function newGame() {
    grid = Array.from({ length: N }, () => Array(N).fill(-1));
    tray = gen3();
    score = 0; shown = 0; combo = 0; over = false; overAt = 0;
    best = parseInt(store.get('bp_best', '0'), 10) || 0;
    startBest = best;
    drag = null; parts = []; pops = []; clearing = [];
    document.getElementById('over').hidden = true;
    document.getElementById('settings').hidden = true;
  }

  // ---------- audio / haptics ----------
  let ac = null;
  function audio() {
    if (!sound) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(f, d, type, vol, delay) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + d + 0.02);
  }
  function buzz(ms) { if (vib) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* ignore */ } } }
  const sfx = {
    pick() { tone(520, 0.06, 'triangle', 0.08); },
    place() { tone(220, 0.09, 'triangle', 0.18); tone(330, 0.07, 'sine', 0.08, 0.02); },
    clear(n, cmb) {
      const base = 520 + Math.min(cmb, 6) * 60;
      for (let i = 0; i < Math.min(2 + n, 6); i++) tone(base * Math.pow(1.122, i * 2), 0.18, 'triangle', 0.14, i * 0.06);
    },
    perfect() { [660, 830, 990, 1320].forEach((f, i) => tone(f, 0.3, 'sine', 0.14, i * 0.08)); },
    over() { [440, 370, 311, 220].forEach((f, i) => tone(f, 0.28, 'sawtooth', 0.07, i * 0.14)); },
  };

  // ---------- layout ----------
  function layout() {
    const m = 16;
    bs = Math.max(160, Math.min(W - 2 * m, H - 112 - 175));
    cs = bs / N;
    bx = (W - bs) / 2;
    by = Math.max(112, Math.min(H * 0.17, H - bs - 175));
    trayY = by + bs + (H - by - bs) * 0.3;
    mini = Math.min(cs * 0.5, (W / 3 - 14) / 5);
  }
  function resize() {
    const r = wrap.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    layout();
  }
  const slotX = i => W * (2 * i + 1) / 6;

  // ---------- game logic ----------
  const GAIN = [0, 10, 30, 60, 100, 150, 210, 280, 360, 450, 550, 660, 780, 910, 1050, 1200, 1360];

  function targetPos(d) {
    // returns {r,c} for the dragged piece or null
    const p = tray[d.i];
    const fx = (d.px - p.w * cs / 2 - bx) / cs;
    const fy = (d.py - d.lift - p.h * cs / 2 - by) / cs;
    let bestPos = null, bestDist = 0.8;
    for (let r = Math.floor(fy) - 1; r <= Math.ceil(fy) + 1; r++) {
      for (let c = Math.floor(fx) - 1; c <= Math.ceil(fx) + 1; c++) {
        if (!fits(p, r, c)) continue;
        const dist = Math.hypot(r - fy, c - fx);
        if (dist < bestDist) { bestDist = dist; bestPos = { r, c }; }
      }
    }
    return bestPos;
  }

  function fullLines(g) {
    const rows = [], cols = [];
    for (let r = 0; r < N; r++) if (g[r].every(v => v >= 0)) rows.push(r);
    for (let c = 0; c < N; c++) { let ok = true; for (let r = 0; r < N; r++) if (g[r][c] < 0) { ok = false; break; } if (ok) cols.push(c); }
    return { rows, cols };
  }

  function popText(text, x, y, o) {
    pops.push(Object.assign({ text, x, y, t: 0, life: 1.0, size: 28, color: '#fff', stroke: null, rise: 40 }, o || {}));
  }

  function place(i, r0, c0) {
    const p = tray[i];
    const cx = bx + (c0 + p.w / 2) * cs, cy = by + (r0 + p.h / 2) * cs;
    for (const [y, x] of p.cells) grid[r0 + y][c0 + x] = p.color;
    p.used = true;
    score += p.cells.length;
    sfx.place(); buzz(8);

    const { rows, cols } = fullLines(grid);
    const n = rows.length + cols.length;
    if (n > 0) {
      combo++;
      const mark = Array.from({ length: N }, () => Array(N).fill(false));
      rows.forEach(r => { for (let c = 0; c < N; c++) mark[r][c] = true; });
      cols.forEach(c => { for (let r = 0; r < N; r++) mark[r][c] = true; });
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (!mark[r][c]) continue;
        const col = grid[r][c];
        clearing.push({ r, c, col, t: 0, delay: (rows.includes(r) ? c : r) * 0.025 });
        for (let k = 0; k < 3; k++) {
          const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220;
          parts.push({ x: bx + (c + .5) * cs, y: by + (r + .5) * cs, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, s: 2 + Math.random() * 4, life: 0.5 + Math.random() * 0.5, t: 0, col: PAL[col][Math.random() < .5 ? 0 : 1] });
        }
        grid[r][c] = -1;
      }
      const gain = (GAIN[Math.min(n, GAIN.length - 1)]) + (combo - 1) * 10;
      score += gain;
      const mx = rows.length && !cols.length ? W / 2 : bx + ((cols[0] || 0) + .5) * cs;
      const my = rows.length ? by + (rows[0] + .5) * cs : by + bs / 2;
      popText('+' + gain, mx, my, { size: 30, life: 0.9, rise: 50 });
      if (combo >= 2) popText('コンボ ×' + combo, W / 2, by + bs + 22, { size: 22, color: '#ffd24a', life: 1.0, rise: 24 });
      sfx.clear(n, combo); buzz(20 + n * 10);

      const empty = grid.every(row => row.every(v => v < 0));
      if (empty) {
        score += 100;
        popText('Perfect!', W / 2, by + bs * 0.45, { size: 60, stroke: '#e02a52', life: 1.5, rise: 20, rot: -0.07 });
        popText('+100', W / 2, by + bs * 0.45 + 52, { size: 28, color: '#ffe27a', life: 1.4, rise: 14 });
        confetti(W / 2, by + bs / 2, 46);
        sfx.perfect();
      } else if (n >= 2) {
        const t = n >= 4 ? 'Perfect!' : n === 3 ? 'Great!' : 'Good!';
        popText(t, W / 2, by + bs * 0.45, { size: n >= 4 ? 56 : 46, stroke: '#e02a52', life: 1.1, rise: 18, rot: -0.07 });
        if (n >= 4) confetti(W / 2, by + bs / 2, 30);
      }
    } else {
      combo = 0;
    }

    if (score > best) { best = score; store.set('bp_best', String(best)); }

    if (tray.every(t => t.used)) {
      tray = gen3();
    }
    if (!tray.some(t => !t.used && fitsAnywhere(t))) {
      over = true; overAt = performance.now() + 700;
    }
  }

  function confetti(x, y, n) {
    const cols = ['#ffd24a', '#ff5d8f', '#5fd6ff', '#7dff9a', '#ffffff', '#ff9d3c'];
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 320;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140, s: 3 + Math.random() * 4, life: 0.9 + Math.random() * 0.7, t: 0, col: cols[k % cols.length], tilt: true });
    }
  }

  // 共有テキストに入るURL(公開先のURLに書き換えてください)
  const SHARE_URL = 'https://yamamoto5989.github.io/blockpazzle/';
  function showOver() {
    sfx.over();
    document.getElementById('overScore').textContent = score;
    document.getElementById('shareText').hidden = true;
    document.getElementById('btnShare').textContent = '共有';
    document.getElementById('over').hidden = false;
    document.getElementById('btnAgain').focus();
  }
  async function shareScore() {
    const msg = 'ブロックパズルでスコア' + score + 'を記録！ ' + SHARE_URL;
    const btn = document.getElementById('btnShare');
    if (window.AndroidShare) { window.AndroidShare.share(msg); return; }
    try {
      if (navigator.share) { await navigator.share({ text: msg }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try {
      await navigator.clipboard.writeText(msg);
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = '共有'; }, 1800);
    } catch (e) {
      const inp = document.getElementById('shareText');
      inp.value = msg; inp.hidden = false; inp.focus(); inp.select();
      btn.textContent = '上の文をコピーしてください';
    }
  }

  // ---------- input ----------
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', e => {
    if (over) return;
    const { x, y } = pos(e);
    audio();
    if (x > W - 76 && y < 84) { openSettings(); return; }
    if (drag) return;
    for (let i = 0; i < 3; i++) {
      const p = tray[i];
      if (p.used) continue;
      if (Math.abs(x - slotX(i)) < W / 6 && Math.abs(y - trayY) < Math.max(cs * 2, 70)) {
        cv.setPointerCapture(e.pointerId);
        drag = { i, id: e.pointerId, px: x, py: y, lift: cs * 2.3, cx: slotX(i), cy: trayY, k: 0, ret: false };
        sfx.pick();
        e.preventDefault();
        break;
      }
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.ret || e.pointerId !== drag.id) return;
    const { x, y } = pos(e);
    drag.px = x; drag.py = y;
    e.preventDefault();
  });
  function endDrag(e) {
    if (!drag || drag.ret || e.pointerId !== drag.id) return;
    const t = e.type === 'pointercancel' ? null : targetPos(drag);
    if (t) {
      const i = drag.i;
      drag = null;
      place(i, t.r, t.c);
    } else {
      drag.ret = true;
    }
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  const elThemes = document.getElementById('themes');
  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.className = 'th'; b.dataset.id = t.id; b.textContent = t.name; b.type = 'button';
    b.style.background = 'linear-gradient(160deg,' + t.bg0 + ' 0%,' + t.bg1 + ' 55%,' + t.board + ' 56%)';
    b.style.color = t.id === 'light' ? '#27336e' : '#fff';
    b.style.textShadow = t.id === 'light' ? 'none' : '';
    b.onclick = () => applyTheme(t.id, true);
    elThemes.appendChild(b);
  });
  applyTheme(store.get('bp_theme', 'blue'), false);
  const elSet = document.getElementById('settings');
  function openSettings() {
    document.getElementById('optSound').checked = sound;
    document.getElementById('optVib').checked = vib;
    elSet.hidden = false;
    document.getElementById('btnClose').focus();
  }
  document.getElementById('btnClose').onclick = () => { elSet.hidden = true; };
  document.getElementById('btnRestart').onclick = () => newGame();
  document.getElementById('btnAgain').onclick = () => newGame();
  document.getElementById('btnShare').onclick = shareScore;
  document.getElementById('optSound').onchange = e => { sound = e.target.checked; store.set('bp_sound', sound ? '1' : '0'); if (sound) sfx.pick(); };
  document.getElementById('optVib').onchange = e => { vib = e.target.checked; store.set('bp_vib', vib ? '1' : '0'); if (vib) buzz(30); };

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function block(x, y, s, ci, alpha) {
    const [b, l, d] = PAL[ci];
    const g = Math.max(0.5, s * 0.02), q = s - g * 2, e = Math.max(1.5, q * 0.14);
    x += g; y += g;
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = d; ctx.fillRect(x, y, q, q);
    ctx.fillStyle = l;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + q, y); ctx.lineTo(x + q - e, y + e); ctx.lineTo(x + e, y + e); ctx.lineTo(x + e, y + q - e); ctx.lineTo(x, y + q); ctx.closePath(); ctx.fill();
    ctx.fillStyle = b; ctx.fillRect(x + e, y + e, q - 2 * e, q - 2 * e);
    ctx.globalAlpha = 1;
  }
  function piece(p, cx, cy, s, alpha) {
    const x0 = cx - p.w * s / 2, y0 = cy - p.h * s / 2;
    for (const [y, x] of p.cells) block(x0 + x * s, y0 + y * s, s, p.color, alpha);
  }
  function text(str, x, y, size, fill, o) {
    o = o || {};
    ctx.save();
    ctx.translate(x, y);
    if (o.rot) ctx.rotate(o.rot);
    if (o.scale) ctx.scale(o.scale, o.scale);
    ctx.font = '700 ' + size + 'px ' + FONT;
    ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
    if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
    if (o.stroke) {
      ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.2; ctx.strokeStyle = o.stroke; ctx.strokeText(str, 0, 0);
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    }
    ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
    ctx.restore();
  }
  function crown(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#ffb52e';
    ctx.beginPath();
    ctx.moveTo(-14, 10); ctx.lineTo(-17, -9); ctx.lineTo(-7, -2); ctx.lineTo(0, -13); ctx.lineTo(7, -2); ctx.lineTo(17, -9); ctx.lineTo(14, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8a1f'; ctx.fillRect(-14, 6, 28, 5);
    ctx.fillStyle = '#fff3b0';
    [[-17, -9], [0, -13], [17, -9]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 3, 0, 7); ctx.fill(); });
    ctx.restore();
  }
  function gear(x, y, r) {
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = theme.icon;
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); rr(-r * 0.2, -r, r * 0.4, r * 0.55, 2); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, 7); ctx.fill();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now);
    draw(now);
    requestAnimationFrame(frame);
  }

  function update(dt, now) {
    shown += (score - shown) * Math.min(1, dt * 10);
    if (Math.abs(score - shown) < 0.5) shown = score;
    for (const p of tray) if (p.appear < 1) p.appear = Math.min(1, p.appear + dt * 4);
    if (drag) {
      const tx = drag.ret ? slotX(drag.i) : drag.px;
      const ty = drag.ret ? trayY : drag.py - drag.lift;
      const f = Math.min(1, dt * (drag.ret ? 16 : 28));
      drag.cx += (tx - drag.cx) * f; drag.cy += (ty - drag.cy) * f;
      drag.k = Math.max(0, Math.min(1, drag.k + (drag.ret ? -1 : 1) * dt * 9));
      if (drag.ret && Math.hypot(drag.cx - tx, drag.cy - ty) < 3 && drag.k <= 0) drag = null;
    }
    for (const c of clearing) c.t += dt;
    clearing = clearing.filter(c => c.t < 0.4 + c.delay);
    for (const p of parts) { p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.t < p.life);
    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < p.life);
    if (over && now > overAt && document.getElementById('over').hidden) showOver();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, theme.bg0); bg.addColorStop(1, theme.bg1);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // header
    const shownBest = Math.max(best, 0);
    crown(36, 40, 0.95);
    text(String(shownBest), 58, 41, 22, '#ffb52e', { align: 'left' });
    gear(W - 40, 40, 14);
    const sc = String(Math.round(shown));
    if (score >= 60) {
      const dw = 22 + sc.length * 20;
      ctx.save(); ctx.translate(W / 2, by - 44); ctx.rotate(Math.PI / 4);
      const dg = ctx.createLinearGradient(-dw / 2, -dw / 2, dw / 2, dw / 2);
      dg.addColorStop(0, '#58d8ff'); dg.addColorStop(1, '#2c7de8');
      ctx.fillStyle = dg; rr(-dw * 0.36, -dw * 0.36, dw * 0.72, dw * 0.72, 8); ctx.fill();
      ctx.restore();
    }
    text(sc, W / 2, by - 44, 56, score >= 60 ? '#ffffff' : theme.ink);

    // board
    ctx.fillStyle = theme.edge; rr(bx - 5, by - 5, bs + 10, bs + 10, 10); ctx.fill();
    ctx.fillStyle = theme.board; rr(bx - 2, by - 2, bs + 4, bs + 4, 8); ctx.fill();
    ctx.strokeStyle = theme.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < N; i++) { ctx.moveTo(bx + i * cs, by); ctx.lineTo(bx + i * cs, by + bs); ctx.moveTo(bx, by + i * cs); ctx.lineTo(bx + bs, by + i * cs); }
    ctx.stroke();

    // ghost + clear preview
    let tgt = null;
    if (drag && !drag.ret) tgt = targetPos(drag);
    if (tgt) {
      const p = tray[drag.i];
      const sim = grid.map(r => r.slice());
      for (const [y, x] of p.cells) sim[tgt.r + y][tgt.c + x] = p.color;
      const { rows, cols } = fullLines(sim);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = PAL[p.color][1];
      rows.forEach(r => ctx.fillRect(bx, by + r * cs, bs, cs));
      cols.forEach(c => ctx.fillRect(bx + c * cs, by, cs, bs));
      ctx.globalAlpha = 1;
      for (const [y, x] of p.cells) block(bx + (tgt.c + x) * cs, by + (tgt.r + y) * cs, cs, p.color, 0.45);
    }

    // placed blocks
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] >= 0) block(bx + c * cs, by + r * cs, cs, grid[r][c]);

    // clearing animation
    for (const c of clearing) {
      const t = c.t - c.delay;
      if (t < 0) { block(bx + c.c * cs, by + c.r * cs, cs, c.col); continue; }
      const k = Math.min(1, t / 0.35), s = cs * (1 - k * 0.9);
      const cx = bx + (c.c + .5) * cs, cy = by + (c.r + .5) * cs;
      block(cx - s / 2, cy - s / 2, s, c.col, 1 - k);
      ctx.globalAlpha = (1 - k) * 0.7; ctx.fillStyle = '#fff'; ctx.fillRect(cx - s / 2, cy - s / 2, s, s); ctx.globalAlpha = 1;
    }

    // tray
    for (let i = 0; i < 3; i++) {
      const p = tray[i];
      if (p.used || (drag && drag.i === i)) continue;
      const a = p.appear, e = a < 1 ? 1 + 2.2 * Math.pow(a - 1, 3) + 1.2 * Math.pow(a - 1, 2) : 1;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
      piece(p, slotX(i), trayY, mini * e, 1);
      ctx.restore();
    }
    if (drag) {
      const p = tray[drag.i], k = drag.k, s = mini + (cs - mini) * (1 - Math.pow(1 - k, 3));
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 8;
      piece(p, drag.cx, drag.cy, s, 1);
      ctx.restore();
    }

    // particles
    for (const p of parts) {
      const k = p.t / p.life;
      ctx.globalAlpha = 1 - k; ctx.fillStyle = p.col;
      if (p.tilt) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t * 9); ctx.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); ctx.restore(); }
      else ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // floating texts
    for (const p of pops) {
      const k = p.t / p.life;
      const sc2 = k < 0.15 ? 0.5 + (k / 0.15) * 0.7 : k < 0.28 ? 1.2 - ((k - 0.15) / 0.13) * 0.2 : 1;
      const al = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      text(p.text, p.x, p.y - p.rise * k, p.size, p.stroke ? '#fff' : p.color, { stroke: p.stroke, scale: sc2, alpha: al, rot: p.rot });
    }
  }

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') elSet.hidden = true; });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  resize();
  newGame();
  window.__bp = { get grid() { return grid; }, get tray() { return tray; }, get score() { return score; }, get layout() { return { bx, by, cs, trayY, W, H }; }, place, fitsAnywhere, get over() { return over; } };
  requestAnimationFrame(frame);
})();
</script>

</body></html>
