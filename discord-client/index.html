<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Discordクライアント</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-screen">
  <h1>Discordクライアント</h1>
  <button id="login-btn">Discordでログイン</button>
</div>

<div id="app-screen" class="hidden">
  <header id="top-bar">
    <button id="menu-btn" aria-label="メニュー">☰</button>
    <span id="current-channel-name">チャンネル未選択</span>
    <span id="me-name"></span>
  </header>

  <nav id="sidebar" class="hidden">
    <div id="guild-list"></div>
    <hr />
    <div id="text-channel-list"></div>
    <hr />
    <div id="voice-channel-list"></div>
  </nav>

  <main id="chat-area">
    <div id="messages"></div>
    <form id="send-form">
      <input id="msg-input" type="text" placeholder="メッセージを入力" autocomplete="off" />
      <button type="submit">送信</button>
    </form>
  </main>

  <div id="voice-bar" class="hidden">
    🔊 VC接続中: <span id="voice-channel-name"></span>
    <button id="voice-leave-btn">切断</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
