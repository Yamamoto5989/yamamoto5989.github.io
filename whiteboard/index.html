<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホでの正しい表示のためのviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホワイトボード</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="Whiteboard_Icon.png">
<link rel="apple-touch-icon" href="Whiteboard_Icon.png">
<style>
/* ページ全体：余白なし、スクロールなし */
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  width: 100%;
}

/* ツールバーは常に画面上部に固定、内容が収まらない場合は横スクロール可能 */
.toolbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: rgba(240, 240, 240, 0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  z-index: 10;
  overflow-x: auto;
  white-space: nowrap;
}
.toolbar button,
.toolbar input,
.toolbar label {
  padding: 10px;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

/* スライダーの横幅 */
.toolbar input[type="range"] {
  width: 300px;
}

/* キャンバスコンテナ：ウィンドウサイズに合わせ、余分な部分を隠す */
#canvasContainer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* キャンバス：HTML属性で指定した実寸のまま利用（CSSでの拡大はしない） */
canvas {
  display: block;
  /* ブラウザ標準のスクロール/ズーム等のタッチ処理を無効化（Pointer Eventsで処理） */
  touch-action: none;
}

/* 消しゴムプレビュー用の円 */
#eraserPreview {
  position: absolute;
  pointer-events: none;
  border: 1px solid gray;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: none;
}
</style>
</head>
<body>
<div class="toolbar">
  <button id="pen">ペン</button>
  <button id="eraser">消しゴム</button>
  <label for="size">太さ:</label>
  <input type="range" id="size" min="1" max="50" value="10" step="1">
  <!-- ペンの色選択はトグルボタンで切替。初期は黒 -->
  ペンの色：
  <button id="penColorToggle">黒</button>
  <button id="undo">↶</button>
  <button id="clear">すべて消す</button>
  <button id="download">ダウンロード</button>
</div>
<div id="canvasContainer">
  <!-- 初期は800×600のキャンバス。ウィンドウが広がった場合は拡大していく -->
  <canvas id="drawingCanvas" width="800" height="600"></canvas>
  <div id="eraserPreview"></div>
</div>

<script>
const canvas = document.getElementById('drawingCanvas');
const context = canvas.getContext('2d');
const eraserPreview = document.getElementById('eraserPreview');
const container = document.getElementById('canvasContainer');

context.fillStyle = 'white';
context.fillRect(0, 0, canvas.width, canvas.height);

/*
  resizeCanvas の仕様：
  - ウィンドウが広がった場合は、キャンバスを拡大（既存内容は保持）。
  - ウィンドウが縮小された場合は、キャンバスはそのままにして、表示領域だけ切り取ります。
*/
function resizeCanvas() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  container.style.width = winW + 'px';
  container.style.height = winH + 'px';

  let newCanvasWidth = canvas.width;
  let newCanvasHeight = canvas.height;
  if (winW > canvas.width) {
    newCanvasWidth = winW;
  }
  if (winH > canvas.height) {
    newCanvasHeight = winH;
  }
  if (newCanvasWidth !== canvas.width || newCanvasHeight !== canvas.height) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);

    canvas.width = newCanvasWidth;
    canvas.height = newCanvasHeight;
    context.fillStyle = 'white';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(tempCanvas, 0, 0);
  }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let drawing = false;
let activePointerId = null;
let erasing = false;
let lineWidth = 10; // 初期太さ10px
// 初期ペン色は黒
let currentPenColor = "#000000";
let undoStack = [];

function pushUndoState() {
  if (canvas.width === 0 || canvas.height === 0) return;
  const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
  if (undoStack.length >= 15) {
    undoStack.shift();
  }
  undoStack.push(imgData);
}

function undo() {
  if (undoStack.length === 0) return;
  const previousState = undoStack.pop();
  context.putImageData(previousState, 0, 0);
}

// キャンバス内描画用の座標取得
function getCoordinates(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

// 消しゴムプレビュー用：container基準の座標取得
function getContainerCoordinates(event) {
  const rect = container.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

function updateEraserPreview(event) {
  const coords = getContainerCoordinates(event);
  eraserPreview.style.left = coords.x + 'px';
  eraserPreview.style.top = coords.y + 'px';
  eraserPreview.style.width = lineWidth + 'px';
  eraserPreview.style.height = lineWidth + 'px';
  eraserPreview.style.display = 'block';
}

/*
  「実際に画面に触れている（押している）か」の判定。
  Sペンは近づけただけ（ホバー）でもポインターイベントが届くため、
  ペンの場合は主ボタン(buttons & 1)が押され、かつ筆圧 > 0 のときだけ接触とみなす。
  指・マウスは従来どおり。
*/
function isContact(event) {
  if (event.pointerType === 'pen') {
    return (event.buttons & 1) === 1 && event.pressure > 0;
  }
  return (event.buttons & 1) === 1;
}

function startDrawing(event) {
  // ホバー（非接触）では描画を開始しない
  if (!isContact(event)) return;
  // すでに別のポインターで描画中なら無視（パームリジェクション的な保険）
  if (drawing) return;

  event.preventDefault();
  pushUndoState();
  drawing = true;
  activePointerId = event.pointerId;
  try { canvas.setPointerCapture(event.pointerId); } catch (e) {}

  const coords = getCoordinates(event);
  context.beginPath();
  context.moveTo(coords.x, coords.y);
  // 点だけのタップでも描画されるように、始点に丸を打つ
  context.fillStyle = erasing ? 'white' : currentPenColor;
  context.beginPath();
  context.arc(coords.x, coords.y, lineWidth / 2, 0, Math.PI * 2);
  context.fill();
  context.beginPath();
  context.moveTo(coords.x, coords.y);

  if (erasing) {
    updateEraserPreview(event);
  }
}

function stopDrawing(event) {
  if (!drawing) return;
  if (event && event.pointerId !== activePointerId) return;
  drawing = false;
  if (activePointerId !== null) {
    try { canvas.releasePointerCapture(activePointerId); } catch (e) {}
  }
  activePointerId = null;
  context.beginPath();
}

function draw(event) {
  if (erasing) {
    // 消しゴムのプレビューはホバー中も表示
    updateEraserPreview(event);
  } else {
    eraserPreview.style.display = 'none';
  }

  if (!drawing) return;
  if (event.pointerId !== activePointerId) return;

  // 描画中にペンが浮いた（接触が外れた）場合は即座に描画終了
  if (!isContact(event)) {
    stopDrawing(event);
    return;
  }

  event.preventDefault();
  const coords = getCoordinates(event);
  context.lineWidth = lineWidth;
  context.lineCap = 'round';
  // 消しゴム時は 'white' を使用
  context.strokeStyle = erasing ? 'white' : currentPenColor;
  context.lineTo(coords.x, coords.y);
  context.stroke();
  context.beginPath();
  context.moveTo(coords.x, coords.y);
}

// イベント登録（Pointer Events に統一。マウス/タッチの互換イベントは使わない）
canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);
canvas.addEventListener('lostpointercapture', stopDrawing);
// キャンバス外でのホバー時に消しゴムプレビューを消す
canvas.addEventListener('pointerleave', (event) => {
  if (!drawing) eraserPreview.style.display = 'none';
});
// 長押しメニュー等を抑止
canvas.addEventListener('contextmenu', (event) => event.preventDefault());

// ツールバー操作
document.getElementById('pen').addEventListener('click', () => {
  erasing = false;
  eraserPreview.style.display = 'none';
});
document.getElementById('eraser').addEventListener('click', () => {
  erasing = true;
});
document.getElementById('size').addEventListener('input', (event) => {
  lineWidth = parseInt(event.target.value, 10);
});

// ペン色のトグルボタンによる切り替え
const penColorToggle = document.getElementById('penColorToggle');
penColorToggle.addEventListener('click', () => {
  if (currentPenColor === "#000000") {
    currentPenColor = "#ff0000";
    penColorToggle.textContent = "赤";
  } else {
    currentPenColor = "#000000";
    penColorToggle.textContent = "黒";
  }
});

document.getElementById('undo').addEventListener('click', () => {
  undo();
});
document.getElementById('clear').addEventListener('click', () => {
  pushUndoState();
  context.fillStyle = 'white';
  context.fillRect(0, 0, canvas.width, canvas.height);
});
document.getElementById('download').addEventListener('click', () => {
  const viewWidth = window.innerWidth;
  const viewHeight = window.innerHeight;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = viewWidth;
  tempCanvas.height = viewHeight;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(canvas, 0, 0, viewWidth, viewHeight, 0, 0, viewWidth, viewHeight);
  const link = document.createElement('a');
  link.download = 'drawing.png';
  link.href = tempCanvas.toDataURL();
  link.click();
});

document.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'z') {
    event.preventDefault();
    undo();
  }
});

window.addEventListener('beforeunload', (e) => {
  e.preventDefault();
  e.returnValue = '';
});
</script>
</body>
</html>
