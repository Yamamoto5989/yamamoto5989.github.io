<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホでの正しい表示のためのviewport設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホワイトボード</title>
<style>
/* ページ全体：余白なし、スクロールなし */
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  width: 100%;
}

/* ツールバーは常に画面上部に固定、内容が収まらない場合は横スクロール可能 */
.toolbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: rgba(240, 240, 240, 0.9);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  z-index: 10;
  overflow-x: auto;
  white-space: nowrap;
}
.toolbar button,
.toolbar input,
.toolbar label {
  padding: 10px;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

/* スライダーの横幅 */
.toolbar input[type="range"] {
  width: 300px;
}

/* キャンバスコンテナ：ウィンドウサイズに合わせ、余分な部分を隠す */
#canvasContainer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* キャンバス：HTML属性で指定した実寸のまま利用（CSSでの拡大はしない） */
canvas {
  display: block;
  position: absolute;
  transform-origin: 50% 50%;
  /* ブラウザ標準のスクロール/ズーム等のタッチ処理を無効化（Pointer Eventsで処理） */
  touch-action: none;
}

/* 消しゴムプレビュー用の円 */
#eraserPreview {
  position: absolute;
  pointer-events: none;
  border: 1px solid gray;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: none;
}
</style>
</head>
<body>
<div class="toolbar">
  <button id="pen">ペン</button>
  <button id="eraser">消しゴム</button>
  <label for="size">太さ:</label>
  <input type="range" id="size" min="1" max="50" value="10" step="1">
  <label for="pressureToggle"><input type="checkbox" id="pressureToggle" checked>筆圧</label>
  <!-- ペンの色選択はトグルボタンで切替。初期は黒 -->
  ペンの色：
  <button id="penColorToggle">黒</button>
  <button id="undo">↶</button>
  <button id="clear">すべて消す</button>
  <button id="download">ダウンロード</button>
</div>
<div id="canvasContainer">
  <!-- 初期は800×600のキャンバス。ウィンドウが広がった場合は拡大していく -->
  <canvas id="drawingCanvas" width="800" height="600"></canvas>
  <div id="eraserPreview"></div>
</div>

<script>
const canvas = document.getElementById('drawingCanvas');
const context = canvas.getContext('2d');
const eraserPreview = document.getElementById('eraserPreview');
const container = document.getElementById('canvasContainer');

context.fillStyle = 'white';
context.fillRect(0, 0, canvas.width, canvas.height);

/*
  画面回転の仕様：
  - ツールバーなどのUIは、回転後の向きに合わせて通常どおり並び直す。
  - キャンバス（描いた内容）は「端末に固定」。端末と一緒に回転し、内容は欠けない。
    実装としては、起動時の向きを基準に、回転した分だけキャンバスを逆向きにCSS回転させる。
    （端末を反時計回りに90°回すと screen.orientation.angle が 90 になる）
  - ウィンドウが広がった場合は、キャンバスを拡大（既存内容は保持）。
  - 縮小された場合は、キャンバスはそのままにして表示領域だけ切り取る（基準向きでは左上基準）。
*/
function currentAngle() {
  let a;
  if (window.screen && screen.orientation && typeof screen.orientation.angle === 'number') {
    a = screen.orientation.angle;
  } else if (typeof window.orientation === 'number') {
    a = window.orientation;
  } else {
    a = window.innerWidth > window.innerHeight ? 90 : 0;
  }
  return (((Math.round(a / 90) * 90) % 360) + 360) % 360;
}
const baseAngle = currentAngle(); // 起動時の向き（この向きのときキャンバスは無回転）
let canvasRotation = 0;           // キャンバスに適用しているCSS回転角(度, 時計回りが正)
let frameW = 0;                   // 現在の画面が、キャンバス座標系で占める幅
let frameH = 0;                   // 同、高さ

function resizeCanvas() {
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  container.style.width = winW + 'px';
  container.style.height = winH + 'px';

  // 起動時の向きからの回転量（端末を反時計回りに回した角度）
  const rel = (currentAngle() - baseAngle + 360) % 360;
  canvasRotation = (360 - rel) % 360;
  const odd = (rel === 90 || rel === 270);
  frameW = odd ? winH : winW;
  frameH = odd ? winW : winH;

  let newCanvasWidth = canvas.width;
  let newCanvasHeight = canvas.height;
  if (frameW > canvas.width) {
    newCanvasWidth = frameW;
  }
  if (frameH > canvas.height) {
    newCanvasHeight = frameH;
  }
  if (newCanvasWidth !== canvas.width || newCanvasHeight !== canvas.height) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(canvas, 0, 0);

    canvas.width = newCanvasWidth;
    canvas.height = newCanvasHeight;
    context.fillStyle = 'white';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(tempCanvas, 0, 0);
  }

  // 画面は、キャンバス座標系の (0,0)-(frameW,frameH) の領域を映す。
  // その領域の中心が画面中心に来るようにキャンバスの中心位置を決め、中心まわりに回転する。
  const rad = canvasRotation * Math.PI / 180;
  const cos = Math.round(Math.cos(rad));
  const sin = Math.round(Math.sin(rad));
  const ox = canvas.width / 2 - frameW / 2;
  const oy = canvas.height / 2 - frameH / 2;
  const centerX = winW / 2 + (ox * cos - oy * sin);
  const centerY = winH / 2 + (ox * sin + oy * cos);
  canvas.style.left = (centerX - canvas.width / 2) + 'px';
  canvas.style.top = (centerY - canvas.height / 2) + 'px';
  canvas.style.transform = 'rotate(' + canvasRotation + 'deg)';
}
window.addEventListener('resize', resizeCanvas);
// 向きの変化通知はリサイズより先に来ることがあるため、少し待ってから再計算する
if (window.screen && screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => setTimeout(resizeCanvas, 150));
}
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
resizeCanvas();

let drawing = false;
let activePointerId = null;
let erasing = false;
let lineWidth = 10; // 初期太さ10px
// 初期ペン色は黒
let currentPenColor = "#000000";
let undoStack = [];

function pushUndoState() {
  if (canvas.width === 0 || canvas.height === 0) return;
  const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
  if (undoStack.length >= 15) {
    undoStack.shift();
  }
  undoStack.push(imgData);
}

function undo() {
  if (undoStack.length === 0) return;
  const previousState = undoStack.pop();
  context.putImageData(previousState, 0, 0);
}

// キャンバス内描画用の座標取得
function getCoordinates(event) {
  // 回転後の外接矩形の中心＝キャンバス中心。そこからの差分を逆回転してキャンバス座標に戻す。
  const rect = canvas.getBoundingClientRect();
  const dx = event.clientX - (rect.left + rect.width / 2);
  const dy = event.clientY - (rect.top + rect.height / 2);
  const rad = canvasRotation * Math.PI / 180;
  const cos = Math.round(Math.cos(rad));
  const sin = Math.round(Math.sin(rad));
  return {
    x: dx * cos + dy * sin + canvas.width / 2,
    y: -dx * sin + dy * cos + canvas.height / 2
  };
}

// 消しゴムプレビュー用：container基準の座標取得
function getContainerCoordinates(event) {
  const rect = container.getBoundingClientRect();
  return { x: event.clientX - rect.left, y: event.clientY - rect.top };
}

function updateEraserPreview(event) {
  const coords = getContainerCoordinates(event);
  eraserPreview.style.left = coords.x + 'px';
  eraserPreview.style.top = coords.y + 'px';
  eraserPreview.style.width = lineWidth + 'px';
  eraserPreview.style.height = lineWidth + 'px';
  eraserPreview.style.display = 'block';
}

/*
  「実際に画面に触れている（押している）か」の判定。
  Sペンは近づけただけ（ホバー）でもポインターイベントが届くが、ホバー中は pressure が 0。
  そこでペンの場合は「pressure > 0（ペン先が実際に触れている）」かつ
  何らかのボタン（先端=1 / サイドボタン=2 / 消しゴム側=32）が立っているときだけ接触とみなす。
  サイドボタンを押しながらでも接触を正しく拾える。指・マウスは従来どおり。
*/
function isContact(event) {
  if (event.pointerType === 'pen') {
    return event.pressure > 0 && (event.buttons & (1 | 2 | 32)) !== 0;
  }
  return (event.buttons & 1) === 1;
}

/* Sペンのサイドボタン(2)・消しゴム側(32)が押されている間は消しゴム扱い */
function isPenEraserButton(event) {
  return event.pointerType === 'pen' && (event.buttons & (2 | 32)) !== 0;
}
function isErasing(event) {
  return erasing || isPenEraserButton(event);
}

/*
  パームリジェクション：ペンが近づいている（ホバー範囲内にある）間は、指での描画を無効にする。
  ペンがホバー範囲から外れると、pointerout の relatedTarget が null になるので、そこで解除する。
*/
let penNear = false;
document.addEventListener('pointerover', (e) => { if (e.pointerType === 'pen') penNear = true; }, true);
document.addEventListener('pointermove', (e) => { if (e.pointerType === 'pen') penNear = true; }, true);
document.addEventListener('pointerdown', (e) => { if (e.pointerType === 'pen') penNear = true; }, true);
document.addEventListener('pointerout', (e) => {
  if (e.pointerType === 'pen' && !e.relatedTarget) penNear = false;
}, true);
document.addEventListener('pointercancel', (e) => { if (e.pointerType === 'pen') penNear = false; }, true);
window.addEventListener('blur', () => { penNear = false; });

/*
  筆圧：ペンのときだけ有効。スライダーの太さ＝最大筆圧時の太さ。
  筆圧は急に変わるとガタつくので、軽く平滑化する。消しゴムは太さ固定。
*/
let usePressure = true;
let smoothedPressure = 0.5;
function resetPressure(event) {
  smoothedPressure = Math.min(1, Math.max(0, event.pressure)) || 0.5;
}
function widthFor(event, eraseMode) {
  if (eraseMode || !usePressure || event.pointerType !== 'pen') return lineWidth;
  const p = Math.min(1, Math.max(0, event.pressure));
  smoothedPressure += (p - smoothedPressure) * 0.4;
  return Math.max(1, lineWidth * (0.15 + 0.85 * smoothedPressure));
}

/*
  滑らかな線の描画：
  入力点を直線で結ぶと、高速に動かして点の間隔が開いたときに角ができる。
  そこで「隣り合う入力点の中点どうし」を、間の入力点を制御点とした2次ベジェ曲線でつなぐ。
  接線が連続するので角が出ない。太さ（筆圧）は曲線上で線形に補間する。
  曲線は中点までしか描けないため、最後の1区間は指を離したとき(stopDrawing)に仕上げる。
*/
let lastPt = null;      // 直近の入力点 {x, y, w}
let lastMid = null;     // 直近の中点（次の曲線の始点）{x, y, w}
let lastStyle = 'black';

function strokeCurve(m0, c, m1, style) {
  const len = Math.hypot(c.x - m0.x, c.y - m0.y) + Math.hypot(m1.x - c.x, m1.y - c.y);
  const steps = Math.max(1, Math.ceil(len / 2)); // 約2pxごとに細かく刻む
  context.strokeStyle = style;
  context.lineCap = 'round';
  context.lineJoin = 'round';
  let px = m0.x, py = m0.y;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    const x = u * u * m0.x + 2 * u * t * c.x + t * t * m1.x;
    const y = u * u * m0.y + 2 * u * t * c.y + t * t * m1.y;
    context.lineWidth = m0.w + (m1.w - m0.w) * t;
    context.beginPath();
    context.moveTo(px, py);
    context.lineTo(x, y);
    context.stroke();
    px = x;
    py = y;
  }
  context.beginPath();
}

function addPoint(x, y, w, style) {
  lastStyle = style;
  if (!lastPt) {
    lastPt = { x: x, y: y, w: w };
    lastMid = { x: x, y: y, w: w };
    return;
  }
  // 手ブレ・同一座標の重複で線がギザつくのを避けるため、ごく近い点は無視
  if (Math.hypot(x - lastPt.x, y - lastPt.y) < 0.8) return;
  const mid = { x: (lastPt.x + x) / 2, y: (lastPt.y + y) / 2, w: (lastPt.w + w) / 2 };
  strokeCurve(lastMid, lastPt, mid, style);
  lastPt = { x: x, y: y, w: w };
  lastMid = mid;
}

function finishStroke() {
  // 最後の中点から、実際の最終入力点まで仕上げる（線が指を離した位置まで届くように）
  if (lastPt && lastMid && (lastMid.x !== lastPt.x || lastMid.y !== lastPt.y)) {
    strokeCurve(lastMid, { x: (lastMid.x + lastPt.x) / 2, y: (lastMid.y + lastPt.y) / 2, w: 0 }, lastPt, lastStyle);
  }
  lastPt = null;
  lastMid = null;
}

function startDrawing(event) {
  // ホバー（非接触）では描画を開始しない
  if (!isContact(event)) return;
  // ペンが近づいている間は指（タッチ）で描かない
  if (event.pointerType === 'touch' && penNear) return;
  // すでに別のポインターで描画中なら無視（パームリジェクション的な保険）
  if (drawing) return;

  event.preventDefault();
  pushUndoState();
  drawing = true;
  activePointerId = event.pointerId;
  try { canvas.setPointerCapture(event.pointerId); } catch (e) {}

  const eraseMode = isErasing(event);
  resetPressure(event);
  const w = widthFor(event, eraseMode);
  const coords = getCoordinates(event);
  const style = eraseMode ? 'white' : currentPenColor;
  // 点だけのタップでも描画されるように、始点に丸を打つ
  context.fillStyle = style;
  context.beginPath();
  context.arc(coords.x, coords.y, w / 2, 0, Math.PI * 2);
  context.fill();
  context.beginPath();

  lastPt = null;
  lastMid = null;
  addPoint(coords.x, coords.y, w, style);

  if (eraseMode) {
    updateEraserPreview(event);
  }
}

function stopDrawing(event) {
  if (!drawing) return;
  if (event && event.pointerId !== activePointerId) return;
  finishStroke();
  drawing = false;
  if (activePointerId !== null) {
    try { canvas.releasePointerCapture(activePointerId); } catch (e) {}
  }
  activePointerId = null;
  context.beginPath();
}

function draw(event) {
  const eraseMode = isErasing(event);
  if (eraseMode) {
    // 消しゴムのプレビューはホバー中も表示（サイドボタンを押した瞬間から出る）
    updateEraserPreview(event);
  } else {
    eraserPreview.style.display = 'none';
  }

  if (!drawing) return;
  if (event.pointerId !== activePointerId) return;

  // 指で描いている途中でペンが近づいたら、指のストロークは打ち切る
  if (event.pointerType === 'touch' && penNear) {
    stopDrawing(event);
    return;
  }

  // 描画中にペンが浮いた（接触が外れた）場合は即座に描画終了
  if (!isContact(event)) {
    stopDrawing(event);
    return;
  }

  event.preventDefault();
  // 高速に動かしたときも滑らかになるよう、間引かれたイベントも使う
  const points = (event.getCoalescedEvents && event.getCoalescedEvents().length)
    ? event.getCoalescedEvents()
    : [event];
  const style = eraseMode ? 'white' : currentPenColor;
  for (const e of points) {
    const coords = getCoordinates(e);
    addPoint(coords.x, coords.y, widthFor(e, eraseMode), style);
  }
}

// イベント登録（Pointer Events に統一。マウス/タッチの互換イベントは使わない）
canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);
canvas.addEventListener('lostpointercapture', stopDrawing);
// キャンバス外でのホバー時に消しゴムプレビューを消す
canvas.addEventListener('pointerleave', (event) => {
  if (!drawing) eraserPreview.style.display = 'none';
});
// 長押しメニュー等を抑止
canvas.addEventListener('contextmenu', (event) => event.preventDefault());

// ツールバー操作
document.getElementById('pen').addEventListener('click', () => {
  erasing = false;
  eraserPreview.style.display = 'none';
});
document.getElementById('eraser').addEventListener('click', () => {
  erasing = true;
});
document.getElementById('size').addEventListener('input', (event) => {
  lineWidth = parseInt(event.target.value, 10);
});
document.getElementById('pressureToggle').addEventListener('change', (event) => {
  usePressure = event.target.checked;
});

// ペン色のトグルボタンによる切り替え
const penColorToggle = document.getElementById('penColorToggle');
penColorToggle.addEventListener('click', () => {
  if (currentPenColor === "#000000") {
    currentPenColor = "#ff0000";
    penColorToggle.textContent = "赤";
  } else {
    currentPenColor = "#000000";
    penColorToggle.textContent = "黒";
  }
});

document.getElementById('undo').addEventListener('click', () => {
  undo();
});
document.getElementById('clear').addEventListener('click', () => {
  pushUndoState();
  context.fillStyle = 'white';
  context.fillRect(0, 0, canvas.width, canvas.height);
});
document.getElementById('download').addEventListener('click', () => {
  // 回転していても、基準の向きのまま画面に映っている範囲を保存する
  const viewWidth = frameW;
  const viewHeight = frameH;
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = viewWidth;
  tempCanvas.height = viewHeight;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(canvas, 0, 0, viewWidth, viewHeight, 0, 0, viewWidth, viewHeight);
  const link = document.createElement('a');
  link.download = 'drawing.png';
  link.href = tempCanvas.toDataURL();
  link.click();
});

document.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'z') {
    event.preventDefault();
    undo();
  }
});

window.addEventListener('beforeunload', (e) => {
  e.preventDefault();
  e.returnValue = '';
});
</script>
</body>
  </html>
